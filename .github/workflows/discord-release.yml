# Posts each published release to Discord with its full changelog.
# The release text goes through env vars, never into the script itself.
# Run it by hand (Actions → Run workflow) to post an existing release as a demo.
name: Discord release notes
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to post (empty = latest)'
        required: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post the changelog to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          URL: ${{ github.event.release.html_url }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            R=$(gh release view ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --json name,tagName,body,url)
            NAME="$(jq -r 'if (.name // "") == "" then .tagName else .name end' <<<"$R") (demo)"
            BODY=$(jq -r .body <<<"$R")
            URL=$(jq -r .url <<<"$R")
          fi
          # Discord caps an embed description at 4096 characters. It does not draw
          # images inside the text, so the first markdown image becomes the embed
          # image, and the title is not prefixed twice.
          node -e '
            const { NAME, BODY, URL } = process.env;
            const img = /!\[[^\]]*\]\(([^)\s]+)\)/.exec(BODY)?.[1];
            const text = BODY.replace(/!\[[^\]]*\]\([^)]*\)\s*/g, "");
            const embed = { title: /^limited ?sniper/i.test(NAME) ? NAME : "Limited Sniper " + NAME, url: URL, color: 5793266,
              description: text.length > 4000 ? text.slice(0, 4000) + "…" : text,
              footer: { text: "Download from the link above or the in-app Update button" } };
            if (img) embed.image = { url: img };
            process.stdout.write(JSON.stringify({ allowed_mentions: { parse: [] }, embeds: [embed] }));
          ' | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
